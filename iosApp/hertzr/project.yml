# XcodeGen: erzeugt hertzr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/hertzr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: hertzr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  hertzr:
    type: application
    platform: iOS
    sources:
      - path: hertzr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.hertzr
        PRODUCT_NAME: hertzr
        INFOPLIST_FILE: hertzr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/hertzr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit -framework AVFAudio -framework MediaPlayer"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:hertzr:shared:embedAndSignAppleFrameworkForXcode
  HertzrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HertzrUITests
    dependencies:
      - target: hertzr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.hertzr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: hertzr
schemes:
  hertzr:
    build:
      targets:
        hertzr: all
        HertzrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: hertzr.storekit
    test:
      config: Debug
      targets:
        - HertzrUITests
    archive:
      config: Release
