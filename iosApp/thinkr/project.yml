# XcodeGen: erzeugt thinkr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/thinkr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: thinkr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  thinkr:
    type: application
    platform: iOS
    sources:
      - path: thinkr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.thinkr
        PRODUCT_NAME: thinkr
        INFOPLIST_FILE: thinkr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/thinkr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:thinkr:shared:embedAndSignAppleFrameworkForXcode
  ThinkrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ThinkrUITests
    dependencies:
      - target: thinkr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.thinkr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: thinkr
schemes:
  thinkr:
    build:
      targets:
        thinkr: all
        ThinkrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: thinkr.storekit
    test:
      config: Debug
      targets:
        - ThinkrUITests
    archive:
      config: Release
