# XcodeGen: erzeugt levlr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/levlr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: levlr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  levlr:
    type: application
    platform: iOS
    sources:
      - path: levlr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.levlr
        PRODUCT_NAME: levlr
        INFOPLIST_FILE: levlr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/levlr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:levlr:shared:embedAndSignAppleFrameworkForXcode
  LevlrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LevlrUITests
    dependencies:
      - target: levlr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.levlr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: levlr
schemes:
  levlr:
    build:
      targets:
        levlr: all
        LevlrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: levlr.storekit
    test:
      config: Debug
      targets:
        - LevlrUITests
    archive:
      config: Release
