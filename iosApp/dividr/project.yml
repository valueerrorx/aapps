# XcodeGen: erzeugt dividr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/dividr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: dividr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  dividr:
    type: application
    platform: iOS
    sources:
      - path: dividr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.dividr
        PRODUCT_NAME: dividr
        INFOPLIST_FILE: dividr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/dividr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:dividr:shared:embedAndSignAppleFrameworkForXcode
  DividrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DividrUITests
    dependencies:
      - target: dividr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.dividr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: dividr
schemes:
  dividr:
    build:
      targets:
        dividr: all
        DividrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: dividr.storekit
    test:
      config: Debug
      targets:
        - DividrUITests
    archive:
      config: Release
