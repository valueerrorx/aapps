# XcodeGen: erzeugt spinr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/spinr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: spinr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  spinr:
    type: application
    platform: iOS
    sources:
      - path: spinr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.spinr
        PRODUCT_NAME: spinr
        INFOPLIST_FILE: spinr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/spinr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:spinr:shared:embedAndSignAppleFrameworkForXcode
  SpinrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpinrUITests
    dependencies:
      - target: spinr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.spinr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: spinr
schemes:
  spinr:
    build:
      targets:
        spinr: all
        SpinrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: spinr.storekit
    test:
      config: Debug
      targets:
        - SpinrUITests
    archive:
      config: Release
