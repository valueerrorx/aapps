# XcodeGen: erzeugt loudr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/loudr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: loudr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  loudr:
    type: application
    platform: iOS
    sources:
      - path: loudr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.loudr
        PRODUCT_NAME: loudr
        INFOPLIST_FILE: loudr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/loudr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit -framework AVFAudio"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:loudr:shared:embedAndSignAppleFrameworkForXcode
  LoudrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoudrUITests
    dependencies:
      - target: loudr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.loudr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: loudr
schemes:
  loudr:
    build:
      targets:
        loudr: all
        LoudrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: loudr.storekit
    test:
      config: Debug
      targets:
        - LoudrUITests
    archive:
      config: Release
