# XcodeGen: erzeugt scorr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/scorr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: scorr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  scorr:
    type: application
    platform: iOS
    sources:
      - path: scorr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.scorr
        PRODUCT_NAME: scorr
        INFOPLIST_FILE: scorr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/scorr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:scorr:shared:embedAndSignAppleFrameworkForXcode
  ScorrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScorrUITests
    dependencies:
      - target: scorr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.scorr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: scorr
schemes:
  scorr:
    build:
      targets:
        scorr: all
        ScorrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: scorr.storekit
    test:
      config: Debug
      targets:
        - ScorrUITests
    archive:
      config: Release
