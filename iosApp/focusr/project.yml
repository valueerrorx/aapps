# XcodeGen: erzeugt focusr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/focusr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: focusr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  focusr:
    type: application
    platform: iOS
    sources:
      - path: focusr
      - path: ../common
      # Glockenton wie Android (einzige Quelle), im Bundle fuer Benachrichtigung und Vordergrund
      - path: ../../apps/focusr/src/main/res/raw/chime.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.focusr
        PRODUCT_NAME: focusr
        INFOPLIST_FILE: focusr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/focusr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:focusr:shared:embedAndSignAppleFrameworkForXcode
  FocusrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FocusrUITests
    dependencies:
      - target: focusr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.focusr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: focusr
schemes:
  focusr:
    build:
      targets:
        focusr: all
        FocusrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: focusr.storekit
    test:
      config: Debug
      targets:
        - FocusrUITests
    archive:
      config: Release
