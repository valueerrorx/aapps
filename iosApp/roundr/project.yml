# XcodeGen: erzeugt roundr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/roundr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: roundr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  roundr:
    type: application
    platform: iOS
    sources:
      - path: roundr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.roundr
        PRODUCT_NAME: roundr
        INFOPLIST_FILE: roundr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/roundr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:roundr:shared:embedAndSignAppleFrameworkForXcode
  RoundrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RoundrUITests
    dependencies:
      - target: roundr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.roundr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: roundr
schemes:
  roundr:
    build:
      targets:
        roundr: all
        RoundrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: roundr.storekit
    test:
      config: Debug
      targets:
        - RoundrUITests
    archive:
      config: Release
