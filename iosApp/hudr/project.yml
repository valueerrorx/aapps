# XcodeGen: erzeugt hudr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/hudr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: hudr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  hudr:
    type: application
    platform: iOS
    sources:
      - path: hudr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.hudr
        PRODUCT_NAME: hudr
        INFOPLIST_FILE: hudr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/hudr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:hudr:shared:embedAndSignAppleFrameworkForXcode
  HudrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HudrUITests
    dependencies:
      - target: hudr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.hudr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: hudr
schemes:
  hudr:
    build:
      targets:
        hudr: all
        HudrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: hudr.storekit
    test:
      config: Debug
      targets:
        - HudrUITests
    archive:
      config: Release
