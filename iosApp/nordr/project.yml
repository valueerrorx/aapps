# XcodeGen: erzeugt nordr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/nordr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: nordr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  nordr:
    type: application
    platform: iOS
    sources:
      - path: nordr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.nordr
        PRODUCT_NAME: nordr
        INFOPLIST_FILE: nordr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/nordr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:nordr:shared:embedAndSignAppleFrameworkForXcode
  NordrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NordrUITests
    dependencies:
      - target: nordr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.nordr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: nordr
schemes:
  nordr:
    build:
      targets:
        nordr: all
        NordrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: nordr.storekit
    test:
      config: Debug
      targets:
        - NordrUITests
    archive:
      config: Release
