# XcodeGen: erzeugt pulsr.xcodeproj (nicht im Repo). Version/Build kommen aus der Umgebung:
# AAPPS_VERSION = apps/pulsr/version.txt (wie Android), AAPPS_BUILD = Build-Nummer (CI: run_number + 100)
name: pulsr
options:
  bundleIdPrefix: solutions.xapient
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: ${AAPPS_VERSION}
    CURRENT_PROJECT_VERSION: ${AAPPS_BUILD}
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Gradle im Build-Skript braucht Zugriff ausserhalb der Sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  pulsr:
    type: application
    platform: iOS
    sources:
      - path: pulsr
      - path: ../common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.pulsr
        PRODUCT_NAME: pulsr
        INFOPLIST_FILE: pulsr/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../apps/pulsr/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AappsKit"
    preBuildScripts:
      - name: Kotlin-Framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:pulsr:shared:embedAndSignAppleFrameworkForXcode
  PulsrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PulsrUITests
    dependencies:
      - target: pulsr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.xapient.pulsr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: pulsr
schemes:
  pulsr:
    build:
      targets:
        pulsr: all
        PulsrUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: pulsr.storekit
    test:
      config: Debug
      targets:
        - PulsrUITests
    archive:
      config: Release
