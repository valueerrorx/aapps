name: Android

on:
  push:
    branches: [main]
    tags: ['*-v*']
    paths-ignore: ['research/**', 'docs/**', '**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pfadfilter: nur betroffene Apps bauen; Aenderungen an Core/Build bauen alle
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(ls apps)
          if [[ "$REF" == refs/tags/* ]]; then
            tag=${REF#refs/tags/}
            picked=${tag%-v*}
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            picked=$all
          else
            base=${BASE:-$BEFORE}
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              picked=$all
            else
              files=$(git diff --name-only "$base" HEAD)
              if echo "$files" | grep -qE '^(core/|build-logic/|gradle/|\.github/|settings\.gradle\.kts|build\.gradle\.kts|gradle\.properties|gradlew)'; then
                picked=$all
              else
                picked=$(echo "$files" | sed -n 's#^apps/\([^/]*\)/.*#\1#p' | sort -u)
              fi
            fi
          fi
          json=$(for a in $picked; do [ -d "apps/$a" ] && echo "$a"; done | jq -R . | jq -cs .)
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Keystore nur aus Secrets; fehlt er, signiert Gradle mit dem Debug-Schluessel
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 fehlt, Release-APK ist mit Debug-Schluessel signiert"
          fi

      - name: Pruefen und bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets[format('KEY_PASSWORD_{0}', matrix.app)] }}
        run: |
          export "KEY_PASSWORD_${APP^^}=$KEY_PASSWORD"
          ./gradlew --no-daemon ":apps:$APP:check" ":apps:$APP:verifyRoborazziDebug" ":apps:$APP:assembleRelease"
          cp "apps/$APP/build/outputs/apk/release/$APP-release.apk" "$APP.apk"

      - name: Screenshot-Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-roborazzi-diff
          path: apps/${{ matrix.app }}/build/outputs/roborazzi
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}.apk

      # jeder Push auf main aktualisiert <app>-latest (direkter Download aufs Handy)
      - name: Release <app>-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$APP-latest" -y --cleanup-tag || true
          gh release create "$APP-latest" "$APP.apk" --prerelease --target "$GITHUB_SHA" \
            --title "$APP (aktueller Build #${{ github.run_number }})" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}. APK herunterladen und am Android-Gerät installieren."

      - name: Release fuer Tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APP.apk" --title "$APP ${GITHUB_REF_NAME#$APP-}" --generate-notes
