# iOS-Build levlr auf macOS: Kotlin-Tests, Simulator-Build + UI-Tests; mit Secrets zusaetzlich TestFlight.
# Keine Build-Artefakte hochladen: das Repo ist oeffentlich, Builds gehen nur an App Store Connect.
name: iOS levlr

on:
  push:
    branches: [feat/ios]
    paths:
      - "iosApp/**"
      - "apps/levlr/**"
      - "core/ui/**"
      - "core/store/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios-levlr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-levlr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      AAPPS_BUILD: ${{ github.run_number }}
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      # Actions auf Commit-SHAs gepinnt (Tag als Kommentar)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Xcode waehlen (neueste installierte)
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Version wie Android
        run: echo "AAPPS_VERSION=$(cat apps/levlr/version.txt)" >> "$GITHUB_ENV"

      - name: Kotlin-Tests (JVM + iOS-Simulator)
        run: ./gradlew --no-daemon :core:store:jvmTest :core:store:iosSimulatorArm64Test :apps:levlr:shared:iosSimulatorArm64Test

      - name: Xcode-Projekt erzeugen (XcodeGen 2.49.0, Pruefsumme fest)
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.49.0/xcodegen.zip
          echo "ae5598b33a19ad1e23e775d6648f97375c3529c970905f489358a21055b65e53  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          cd iosApp/levlr && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Simulator-Build + UI-Tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for r, l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild test \
            -project iosApp/levlr/levlr.xcodeproj -scheme levlr \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/levlr-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # Review-Screenshot je In-App-Kauf direkt per API (keine Artefakte); laedt nur, wenn noch keiner da ist
      - name: IAP-Review-Screenshots
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/iap_key.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM_UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/levlr.app"
          for s in OFFER THANKS; do
            xcrun simctl launch --terminate-running-process "$SIM_UDID" solutions.xapient.levlr -levlrScene "$s" -AppleLanguages "(en)" -AppleLocale en_US
            sleep 6
            xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/iap_$s.png"
          done
          node iosApp/tools/asc-iap-screenshot.mjs solutions.xapient.levlr \
            trial="$RUNNER_TEMP/iap_OFFER.png" full_unlock="$RUNNER_TEMP/iap_THANKS.png"

      # App-Screenshots 6.9" + 13", EN + DE, Szenen wie im Play-Store-Listing; direkt per API, ersetzt nur Geaendertes
      - name: App-Screenshots
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/shots_key.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/levlr.app"
          SCENES="EDGE_TILTED EDGE_LEVEL FLAT_TILTED FLAT_LEVEL HELD EDGE_MM CALIBRATE"
          bash iosApp/tools/sim-shots.sh "$APP" solutions.xapient.levlr "$RUNNER_TEMP/shots" APP_IPHONE_67 '^iPhone \d+ Pro Max$' 1320x2868 $SCENES
          bash iosApp/tools/sim-shots.sh "$APP" solutions.xapient.levlr "$RUNNER_TEMP/shots" APP_IPAD_PRO_3GEN_129 '^iPad Pro 13-inch' 2064x2752 $SCENES
          node iosApp/tools/asc-screenshots.mjs solutions.xapient.levlr "$RUNNER_TEMP/shots"
          rm -rf "$RUNNER_TEMP/shots"

      - name: Archiv + Upload zu TestFlight
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # unsigniert archivieren: ein Development-Profil braeuchte ein registriertes Geraet; signiert wird beim Export (App Store)
          xcodebuild archive \
            -project iosApp/levlr/levlr.xcodeproj -scheme levlr -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/levlr.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" iosApp/levlr/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/levlr.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -rf "$RUNNER_TEMP/levlr.xcarchive" "$RUNNER_TEMP/export"
