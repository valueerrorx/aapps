# Android-Pruefung aller Apps: Build, Unit-Tests + Lint (check), Roborazzi, APK-Groesse. Ohne Secrets.
# Keine APKs/AABs als Artefakt (Repo oeffentlich); nur Roborazzi-Diffs bei Fehlschlag, 3 Tage.
name: Android check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Apps = include(":apps:<name>") in settings.gradle.kts (ohne Untermodule wie :apps:levlr:shared)
      - id: list
        run: |
          json=$(sed -n 's/^include(":apps:\([a-z0-9]*\)")$/\1/p' settings.gradle.kts | jq -R . | jq -cs .)
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  # Gemeinsame Module, deren Tests in keinem App-Lauf enthalten sind
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/ios' }}
      - name: Gradle fuer CI (mehr RAM als am NAS)
        run: bash .github/ci/gradle-ci.sh
      - name: Core-Tests
        run: ./gradlew --no-daemon :core:billing:check :core:ui:testAndroidHostTest :core:store:jvmTest :apps:levlr:shared:testAndroidHostTest :apps:nordr:shared:testAndroidHostTest :apps:spinr:shared:testAndroidHostTest :apps:magnr:shared:testAndroidHostTest :apps:sleepr:shared:testAndroidHostTest :apps:scorr:shared:testAndroidHostTest :apps:focusr:shared:testAndroidHostTest :apps:hudr:shared:testAndroidHostTest :apps:hertzr:shared:testAndroidHostTest :apps:dividr:shared:testAndroidHostTest :apps:thinkr:shared:testAndroidHostTest :apps:roundr:shared:testAndroidHostTest :apps:loudr:shared:testAndroidHostTest :apps:pulsr:shared:testAndroidHostTest :apps:tunr:shared:testAndroidHostTest

  app:
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # schont Maven Central (429 bei zu vielen parallelen Downloads)
      max-parallel: 9
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/ios' }}
      - name: Gradle fuer CI (mehr RAM als am NAS)
        run: bash .github/ci/gradle-ci.sh

      # check = Unit-Tests, Lint, Berechtigungs-Check (wie lokal laut docs/AGENTS.md)
      - name: Pruefen
        run: ./gradlew --no-daemon ":apps:$APP:check" ":apps:$APP:verifyRoborazziDebug" ":apps:$APP:assembleDebug"

      - name: Roborazzi-Diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-roborazzi-diff
          path: apps/${{ matrix.app }}/build/outputs/roborazzi
          retention-days: 3
          if-no-files-found: ignore

      # Release-APK ohne Upload-Key (Debug-Schluessel), nur fuer die Groesse; main als Vergleich
      - name: APK-Groesse
        run: |
          ./gradlew --no-daemon ":apps:$APP:assembleRelease"
          now=$(stat -c %s apps/$APP/build/outputs/apk/release/*.apk)
          base="-"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            git fetch --no-tags --depth=1 origin main
            git worktree add -q "$RUNNER_TEMP/main" FETCH_HEAD
            if [ -d "$RUNNER_TEMP/main/apps/$APP" ]; then
              (cd "$RUNNER_TEMP/main" && ./gradlew --no-daemon -q ":apps:$APP:assembleRelease") \
                && base=$(stat -c %s "$RUNNER_TEMP"/main/apps/$APP/build/outputs/apk/release/*.apk) \
                || echo "::warning::main-Build fuer $APP fehlgeschlagen"
            fi
          fi
          kb() { [ "$1" = - ] && echo - || echo "$(( $1 / 1024 )) KB"; }
          diff="-"
          [ "$base" != - ] && diff="$(( (now - base) / 1024 )) KB"
          {
            echo "| App | main | ${GITHUB_REF_NAME} | Diff |"
            echo "|---|---|---|---|"
            echo "| $APP | $(kb "$base") | $(kb "$now") | $diff |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK-SIZE $APP main=$base now=$now"
